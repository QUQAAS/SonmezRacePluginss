name: Build SonmezRacePlugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      server_ref:
        description: 'AssettoServer tag/branch'
        default: 'v0.0.55-pre44'
      with_commands:
        description: '/yaris komutunu (Commands.cs.optional) dahil et'
        type: boolean
        default: false

permissions:
  contents: write

env:
  SERVER_REF: ${{ github.event.inputs.server_ref || 'v0.0.55-pre44' }}
  WITH_COMMANDS: ${{ github.event.inputs.with_commands || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: AssettoServer indir
        uses: actions/checkout@v4
        with:
          repository: compujuckel/AssettoServer
          ref: ${{ env.SERVER_REF }}
          path: AssettoServer-src

      - name: Plugin kaynaklarini sunucu deposunun icine koy
        uses: actions/checkout@v4
        with:
          path: AssettoServer-src/SonmezRacePlugin

      - name: Sunucunun istedigi SDK / framework bilgisi
        run: |
          echo "--- global.json"; cat AssettoServer-src/global.json || true
          echo "--- TargetFramework"; grep -n "TargetFramework" AssettoServer-src/AssettoServer/AssettoServer.csproj || true

      # AssettoServer pre44 global.json'da .NET 11 SDK istiyor (preview surum)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Derle
        working-directory: AssettoServer-src/SonmezRacePlugin
        run: |
          set -o pipefail
          TFM=$(grep -oP '(?<=<TargetFramework>)[^<]+' ../AssettoServer/AssettoServer.csproj | head -1)
          echo "Sunucu TargetFramework: $TFM"
          # eklentinin framework'unu sunucununkiyle esitle (restore dahil her adimda gecerli olsun diye csproj'u degistiriyoruz)
          sed -i "s#<TargetFramework>[^<]*</TargetFramework>#<TargetFramework>$TFM</TargetFramework>#" SonmezRacePlugin.csproj
          grep -n "TargetFramework" SonmezRacePlugin.csproj
          dotnet --list-sdks
          dotnet build SonmezRacePlugin.csproj -c Release -p:WithCommands=${{ env.WITH_COMMANDS }} 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Paketle
        run: |
          DLL=$(find AssettoServer-src/SonmezRacePlugin/bin/Release -name SonmezRacePlugin.dll | head -1)
          echo "Bulundu: $DLL"
          mkdir -p package/plugins/SonmezRacePlugin package/cfg
          cp "$DLL" package/plugins/SonmezRacePlugin/
          cp AssettoServer-src/SonmezRacePlugin/cfg_plugin_sonmez_race_cfg.yml package/cfg/plugin_sonmez_race_cfg.yml
          cp AssettoServer-src/SonmezRacePlugin/KURULUM.md package/
          (cd package && zip -r ../SonmezRacePlugin-0.0.55-pre44.zip .)

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Plugin paketi
        uses: actions/upload-artifact@v4
        with:
          name: SonmezRacePlugin-0.0.55-pre44
          path: SonmezRacePlugin-0.0.55-pre44.zip

      - name: Release olustur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SonmezRacePlugin-0.0.55-pre44.zip
